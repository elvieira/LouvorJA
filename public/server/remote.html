<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle Remoto - Louvor JA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      user-select: none;
    }

    header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #161922;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .brand h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .brand h2 {
      font-size: 13px;
      font-weight: 500;
      color: #90a4ae;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffb300;
      box-shadow: 0 0 10px rgba(255, 179, 0, 0.7);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .dot.connected {
      background: #4caf50;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.8);
    }

    .dot.disconnected {
      background: #f44336;
      box-shadow: 0 0 10px rgba(244, 67, 54, 0.8);
    }

    /* CARD DE STATUS ATUAL */
    .now-playing {
      margin: 16px 20px;
      padding: 16px;
      background: #181b26;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .now-playing-title {
      font-size: 16px;
      font-weight: 700;
      color: #64b5f6;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-lyric {
      font-size: 14px;
      color: #b0bec5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }

    /* BOTÕES PRINCIPAIS */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 10px 20px;
    }

    .top-actions {
      display: flex;
      width: 100%;
      max-width: 340px;
      justify-content: space-between;
      gap: 16px;
    }

    .btn {
      background: #1c202d;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      outline: none;
    }

    .btn:active {
      transform: scale(0.92);
      background: #252b3d;
    }

    .btn-action {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      gap: 8px;
    }

    .btn-close {
      background: rgba(244, 67, 54, 0.15);
      border-color: rgba(244, 67, 54, 0.3);
      color: #ef5350;
    }

    /* CONTROLE CRUCIFORME */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 85px);
      grid-template-rows: repeat(3, 85px);
      gap: 14px;
      align-items: center;
      justify-content: center;
    }

    .btn-arrow {
      width: 85px;
      height: 85px;
      border-radius: 24px;
    }

    .btn-center {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: #1976d2;
      border-color: #2196f3;
      box-shadow: 0 8px 24px rgba(25, 118, 210, 0.4);
    }

    .btn-center:active {
      background: #1565c0;
    }

    svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    footer {
      padding: 16px;
      background: #161922;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      font-size: 12px;
      color: #78909c;
    }

    /* MODAL DE TOKEN */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-card {
      background: #1c202d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 26px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-card h3 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #fff;
    }

    .token-input {
      width: 100%;
      height: 52px;
      background: #12141c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      text-align: center;
      margin-bottom: 18px;
      outline: none;
    }

    .token-input:focus {
      border-color: #2196f3;
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.25);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: #1976d2;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div style="width: 16px;"></div>
    <div class="brand">
      <h1>LOUVOR JA</h1>
      <h2>Controle Remoto</h2>
    </div>
    <div id="dot" class="dot"></div>
  </header>

  <div class="now-playing">
    <div id="now-title" class="now-playing-title">LouvorJA Conectado</div>
    <div id="now-lyric" class="now-playing-lyric">Toque nos botões abaixo para controlar a projeção.</div>
  </div>

  <main>
    <div class="top-actions">
      <button class="btn btn-action" onclick="Remote.sendKey(27)">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        <span>Fechar</span>
      </button>
      <button class="btn btn-action" onclick="Remote.openSearch()">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>Buscar</span>
      </button>
    </div>

    <div class="controls-grid">
      <div></div>
      <button class="btn btn-arrow" onclick="Remote.sendKey(38)">
        <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
      </button>
      <div></div>

      <button class="btn btn-arrow" onclick="Remote.sendSlide('previous')">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>

      <button class="btn btn-center" onclick="Remote.sendKey(32)">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="btn btn-arrow" onclick="Remote.sendSlide('next')">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>

      <div></div>
      <button class="btn btn-arrow" onclick="Remote.sendKey(40)">
        <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
      <div></div>
    </div>
  </main>

  <footer>
    <span id="footer-token"></span>
  </footer>

  <!-- MODAL DE TOKEN -->
  <div id="modal-token" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>Digite o Token de Acesso</h3>
      <p style="font-size: 13px; color: #90a4ae; margin-bottom: 16px;">Consulte o token na tela de Transmissão do LouvorJA.</p>
      <input type="text" id="token-input" class="token-input" maxlength="10" placeholder="TOKEN" autocomplete="off" />
      <button class="btn-submit" onclick="Remote.saveToken()">Conectar</button>
    </div>
  </div>

  <script>
    (function () {
      const dotEl = document.getElementById("dot");
      const titleEl = document.getElementById("now-title");
      const lyricEl = document.getElementById("now-lyric");
      const footerTokenEl = document.getElementById("footer-token");
      const modalTokenEl = document.getElementById("modal-token");
      const tokenInputEl = document.getElementById("token-input");

      function getToken() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("token") || localStorage.getItem("louvorja_token") || "";
      }

      function setToken(token) {
        localStorage.setItem("louvorja_token", token);
      }

      function updateStatus(connected) {
        dotEl.className = "dot " + (connected ? "connected" : "disconnected");
      }

      async function callApi(endpoint, params = {}) {
        const token = getToken();
        const url = new URL("/api/" + endpoint, window.location.origin);
        if (token) url.searchParams.set("token", token);
        for (const [k, v] of Object.entries(params)) {
          url.searchParams.set(k, v);
        }

        try {
          const res = await fetch(url.toString());
          const data = await res.json();
          if (res.status === 401 || data.code === "INVALID_TOKEN") {
            modalTokenEl.style.display = "flex";
            updateStatus(false);
            return null;
          }
          updateStatus(true);
          return data;
        } catch (e) {
          updateStatus(false);
          return null;
        }
      }

      window.Remote = {
        async sendSlide(action) {
          await callApi("song-slides", { action: action });
        },
        async sendKey(keyCode) {
          await callApi("keyboard", { key: keyCode });
        },
        openSearch() {
          const termo = prompt("Digite o nome da música ou número do hino:");
          if (termo && termo.trim()) {
            callApi("search-songs", { q: termo.trim() });
          }
        },
        saveToken() {
          const val = tokenInputEl.value.trim();
          if (val) {
            setToken(val);
            modalTokenEl.style.display = "none";
            callApi("ping");
          }
        }
      };

      // EventSource para receber atualização de estado
      function connectSSE() {
        const token = getToken();
        const url = "/api/events" + (token ? "?token=" + encodeURIComponent(token) : "");
        const evt = new EventSource(url);

        evt.addEventListener("state", function (e) {
          try {
            const data = JSON.parse(e.data);
            updateStatus(true);
            if (data.type === "media") {
              titleEl.textContent = data.title || "Música em reprodução";
              lyricEl.textContent = (data.currentLyric || "").trim() || "---";
            } else if (data.type === "bible") {
              titleEl.textContent = data.bibleReference || "Bíblia Sagrada";
              lyricEl.textContent = data.bibleText || "---";
            } else {
              titleEl.textContent = "LouvorJA";
              lyricEl.textContent = "Nenhuma mídia em reprodução.";
            }
          } catch (err) {}
        });

        evt.onerror = function () {
          updateStatus(false);
          evt.close();
          setTimeout(connectSSE, 3000);
        };
      }

      connectSSE();
      callApi("ping");
    })();
  </script>
</body>
</html>
