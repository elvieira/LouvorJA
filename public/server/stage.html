<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LouvorJA - Retorno de Palco (Stage Monitor)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* BARRA SUPERIOR */
    header {
      height: 60px;
      padding: 0 24px;
      background: #14161d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .song-title {
      font-size: 18px;
      font-weight: 600;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65%;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #9e9e9e;
    }

    .clock {
      font-size: 20px;
      font-weight: 700;
      color: #64b5f6;
      letter-spacing: 1px;
    }

    /* ÁREA PRINCIPAL: SLIDE ATUAL */
    .current-section {
      flex: 1.6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      background: radial-gradient(circle at center, #1b1e28 0%, #0d0e12 100%);
      position: relative;
    }

    .current-text {
      font-size: clamp(28px, 4.5vw, 64px);
      line-height: 1.35;
      font-weight: 700;
      color: #ffffff;
      white-space: pre-line;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      transition: opacity 0.25s ease;
    }

    .current-text.cover {
      color: #ffd54f;
    }

    .current-aux {
      font-size: clamp(18px, 2.8vw, 36px);
      font-weight: 500;
      color: #b0bec5;
      margin-top: 14px;
      white-space: pre-line;
    }

    /* DIVISOR */
    .divider {
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.02) 100%);
      flex-shrink: 0;
    }

    /* ÁREA INFERIOR: PRÓXIMO SLIDE */
    .next-section {
      flex: 1;
      padding: 20px 30px;
      background: #111319;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .next-label {
      position: absolute;
      top: 10px;
      left: 24px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ffb74d;
      background: rgba(255, 183, 77, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .next-text {
      font-size: clamp(18px, 2.5vw, 36px);
      line-height: 1.35;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
      white-space: pre-line;
    }

    .empty-state {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.3);
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <div id="title" class="song-title">LouvorJA - Retorno de Palco</div>
    <div class="status-badge">
      <span id="slide-count"></span>
      <span id="clock" class="clock">--:--:--</span>
    </div>
  </header>

  <main class="current-section">
    <div id="current-text" class="current-text empty-state">Aguardando início da apresentação...</div>
    <div id="current-aux" class="current-aux" style="display: none;"></div>
  </main>

  <div class="divider"></div>

  <section class="next-section">
    <span class="next-label">Próxima Estrofe</span>
    <div id="next-text" class="next-text empty-state">Nenhum próximo slide</div>
  </section>

  <script>
    (function () {
      const titleEl = document.getElementById("title");
      const currentTextEl = document.getElementById("current-text");
      const currentAuxEl = document.getElementById("current-aux");
      const nextTextEl = document.getElementById("next-text");
      const slideCountEl = document.getElementById("slide-count");
      const clockEl = document.getElementById("clock");

      function updateClock() {
        const now = new Date();
        clockEl.textContent = now.toLocaleTimeString("pt-BR", { hour12: false });
      }
      setInterval(updateClock, 1000);
      updateClock();

      function render(data) {
        if (!data || data.type === "idle") {
          titleEl.textContent = "LouvorJA - Retorno de Palco";
          currentTextEl.textContent = "Aguardando início da apresentação...";
          currentTextEl.className = "current-text empty-state";
          currentAuxEl.style.display = "none";
          nextTextEl.textContent = "Nenhum próximo slide";
          nextTextEl.className = "next-text empty-state";
          slideCountEl.textContent = "";
          return;
        }

        if (data.type === "media") {
          titleEl.textContent = data.title || "Mídia em Reprodução";

          if (data.totalSlides && data.totalSlides > 0) {
            slideCountEl.textContent = "Slide " + ((data.slideIndex || 0) + 1) + "/" + data.totalSlides;
          } else {
            slideCountEl.textContent = "";
          }

          const current = (data.currentLyric || "").trim();
          if (current) {
            currentTextEl.textContent = current;
            currentTextEl.className = "current-text" + (data.isCover ? " cover" : "");
          } else {
            currentTextEl.textContent = "---";
            currentTextEl.className = "current-text empty-state";
          }

          if (data.auxLyric && data.auxLyric.trim() !== "") {
            currentAuxEl.textContent = data.auxLyric.trim();
            currentAuxEl.style.display = "block";
          } else {
            currentAuxEl.style.display = "none";
          }

          const next = (data.nextLyric || "").trim();
          if (next) {
            nextTextEl.textContent = next;
            nextTextEl.className = "next-text";
          } else {
            nextTextEl.textContent = "Fim da música";
            nextTextEl.className = "next-text empty-state";
          }
        } else if (data.type === "bible") {
          titleEl.textContent = data.bibleReference ? "Bíblia Sagrada - " + data.bibleReference : "Bíblia Sagrada";
          slideCountEl.textContent = data.bibleVersion || "";
          currentTextEl.textContent = data.bibleText || "";
          currentTextEl.className = "current-text";
          currentAuxEl.style.display = "none";
          nextTextEl.textContent = data.bibleReference ? "Referência: " + data.bibleReference : "";
          nextTextEl.className = "next-text empty-state";
        }
      }

      function connectSSE() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token") || "";
        const sseUrl = "/api/events" + (token ? "?token=" + encodeURIComponent(token) : "");
        const evtSource = new EventSource(sseUrl);

        evtSource.addEventListener("state", function (e) {
          try {
            render(JSON.parse(e.data));
          } catch (err) {
            console.error("[SSE Stage] Erro:", err);
          }
        });

        evtSource.onerror = function () {
          evtSource.close();
          setTimeout(connectSSE, 3000);
        };
      }

      if (typeof EventSource !== "undefined") {
        connectSSE();
      } else {
        setInterval(function () {
          fetch("/api/status")
            .then(function (res) { return res.json(); })
            .then(function (res) { if (res && res.data) render(res.data); })
            .catch(function () {});
        }, 500);
      }
    })();
  </script>
</body>
</html>
